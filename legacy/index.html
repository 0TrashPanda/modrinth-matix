<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modrinth Compatibility Matrix</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #121212;
    color: #eee;
    padding: 20px;
}

textarea {
    width: 100%;
    height: 150px;
    background: #1e1e1e;
    color: #eee;
    border: 1px solid #444;
    padding: 10px;
}

button {
    margin-top: 10px;
    padding: 10px 15px;
    background: #4CAF50;
    border: none;
    color: white;
    cursor: pointer;
}

table {
    margin-top: 20px;
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #444;
    padding: 6px;
    text-align: center;
}

th { background: #222; }

th.clickable-header {
    padding: 0;
}

.version-button {
    width: 100%;
    padding: 6px;
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font: inherit;
}

.version-button:hover {
    background: rgba(255, 255, 255, 0.08);
}

.highlight { background: #263b2a; }

.support-cell {
    padding: 0;
    min-width: 58px;
    height: 36px;
}

.support-parts {
    display: flex;
    width: 100%;
    min-height: 36px;
}

.support-part {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    font-size: 0.72em;
    font-weight: 700;
    color: #f3f3f3;
    border-left: 1px solid rgba(255, 255, 255, 0.16);
}

.support-part:first-child {
    border-left: none;
}

.support-client { background: #48657a; }
.support-server { background: #7a4f4f; }
.support-both { background: #66567d; }
.support-unknown { background: #5d5d5d; }
.support-none {
    color: #8b8b8b;
    background: #171717;
}

.side-pill {
    display: inline-block;
    padding: 2px 6px;
    margin-left: 6px;
    border-radius: 3px;
    font-size: 0.7em;
    font-weight: 700;
}

.download-targets {
    display: flex;
    gap: 12px;
    margin: 10px 0 16px;
}

.download-targets label {
    display: inline-flex;
    gap: 6px;
    align-items: center;
}

.dependency-toggle {
    display: inline-flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
}

.count {
    font-size: 0.7em;
    color: #aaa;
    margin-top: 2px;
}

tr.disabled {
    opacity: 0.3;
}

.mod-name a {
    color: #4CAF50;
    text-decoration: none;
}

.mod-name a:hover {
    text-decoration: underline;
}

tr {
    cursor: pointer;
}

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal-backdrop.hidden {
    display: none;
}

.modal {
    width: min(700px, 100%);
    max-height: 85vh;
    overflow-y: auto;
    background: #1b1b1b;
    border: 1px solid #444;
    padding: 20px;
}

.modal h3 {
    margin-top: 0;
}

.choice-group {
    margin: 16px 0;
    padding: 12px;
    border: 1px solid #333;
    background: #151515;
}

.choice-group label {
    display: block;
    margin-top: 8px;
}

.choice-group label:first-of-type {
    margin-top: 10px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
}

.secondary-button {
    background: #555;
}
</style>
</head>
<body>

<h2>Modrinth Compatibility Matrix</h2>

<textarea id="urls" placeholder="Paste Modrinth project URLs (one per line, or separate equivalent mods with commas)"></textarea>

<div>
    <label><input type="radio" name="loader" value="fabric" checked> Fabric</label>
    <label><input type="radio" name="loader" value="forge"> Forge</label>
    <label><input type="radio" name="loader" value="quilt"> Quilt</label>
    <label><input type="radio" name="loader" value="neoforge"> NeoForge</label>
</div>

<div style="margin-top:10px;">
    <label>
        <input type="checkbox" id="snapshots"> Include Snapshots
    </label>
</div>

<button onclick="generate()">Generate Matrix</button>

<div id="output"></div>

<div id="versionModal" class="modal-backdrop hidden" onclick="closeVersionModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <h3 id="modalTitle">Open downloads</h3>
        <div class="download-targets">
            <label><input type="radio" name="download-target" value="client" checked onchange="setDownloadTarget(this.value)"> Client pack</label>
            <label><input type="radio" name="download-target" value="server" onchange="setDownloadTarget(this.value)"> Server pack</label>
        </div>
        <label class="dependency-toggle">
            <input type="checkbox" id="includeDependencies">
            Auto download required dependencies
        </label>
        <div id="modalContent"></div>
        <div class="modal-actions">
            <button class="secondary-button" onclick="hideVersionModal()">Cancel</button>
            <button onclick="openSelectedDownloads()">Open Downloads</button>
        </div>
    </div>
</div>

<script>
let GLOBAL_MODS = [];
let GLOBAL_VERSIONS = [];
let GLOBAL_LOADER = "fabric";
let ACTIVE_VERSION = null;
let ACTIVE_DOWNLOAD_TARGET = "client";
const MODRINTH_URL_PREFIX = "https://modrinth.com";
const SIDE_TAG_PATTERN = /\[\s*(!?)([scb])\s*\]/ig;

function normalizeSideTag(side) {
    const value = side.toLowerCase();
    if (value === "s") return "server";
    if (value === "c") return "client";
    if (value === "b") return "both";
    return null;
}

function parseSideOverride(value) {
    let fallbackSide = null;
    let forcedSide = null;
    let match;
    SIDE_TAG_PATTERN.lastIndex = 0;

    while ((match = SIDE_TAG_PATTERN.exec(value)) !== null) {
        const side = normalizeSideTag(match[2]);
        if (!side) continue;
        if (match[1] === "!") {
            forcedSide = side;
        } else {
            fallbackSide = side;
        }
    }

    return { fallbackSide, forcedSide };
}

function stripSideTags(value) {
    SIDE_TAG_PATTERN.lastIndex = 0;
    return value.replace(SIDE_TAG_PATTERN, "").trim();
}

function isModrinthLookupUrl(value) {
    const cleanValue = stripSideTags(value);
    if (!cleanValue.startsWith(MODRINTH_URL_PREFIX)) return false;

    try {
        const parsed = new URL(cleanValue);
        return parsed.origin === MODRINTH_URL_PREFIX && parsed.pathname.split("/").filter(Boolean).length > 0;
    } catch {
        return false;
    }
}

function lineStartsWithModrinthEntry(line) {
    return isModrinthLookupUrl(line.split(",")[0].trim());
}

function parseModEntry(value) {
    const cleanUrl = stripSideTags(value);
    const parsed = new URL(cleanUrl);
    const pathParts = parsed.pathname.split("/").filter(Boolean);
    const { fallbackSide, forcedSide } = parseSideOverride(value);
    const slug = pathParts[pathParts.length - 1];

    console.log("Slug:", slug, "fallback:", fallbackSide, "forced:", forcedSide);
    return { url: cleanUrl, slug, fallbackSide, forcedSide };
}

function parseModGroups(input) {
    return input
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .filter(lineStartsWithModrinthEntry)
        .map(line => line
            .split(",")
            .map(part => part.trim())
            .filter(isModrinthLookupUrl)
            .map(parseModEntry)
        )
        .filter(group => group.length > 0);
}

function isStableRelease(version) {
    return /^\d+\.\d+(\.\d+)?$/.test(version);
}

function sideRequires(side) {
    return side === "required";
}

function getSupportKind(project) {
    if (!project) return "unknown";

    const requiresClient = sideRequires(project.client_side);
    const requiresServer = sideRequires(project.server_side);

    if (requiresClient && requiresServer) return "both";
    if (requiresClient) return "client";
    if (requiresServer) return "server";
    return "unknown";
}

function resolveSupportKind(project, entry) {
    const modrinthSide = getSupportKind(project);
    if (entry.forcedSide) return entry.forcedSide;
    if (modrinthSide === "unknown" && entry.fallbackSide) return entry.fallbackSide;
    return modrinthSide;
}

function optionMatchesTarget(option, target) {
    if (option.side === "both") return true;
    return option.side === target;
}

function getPrimaryFile(version) {
    if (!version || !Array.isArray(version.files) || version.files.length === 0) return null;
    return version.files.find(file => file.primary) || version.files[0];
}

async function fetchProject(slug) {
    console.group(`Fetching metadata: ${slug}`);
    try {
        const res = await fetch(`https://api.modrinth.com/v2/project/${slug}`);
        if (!res.ok) {
            console.error("HTTP error:", res.status);
            console.groupEnd();
            return null;
        }

        const data = await res.json();
        console.log("Sides:", data.client_side, data.server_side);
        console.groupEnd();
        return data;

    } catch (err) {
        console.error("Metadata fetch failed:", err);
        console.groupEnd();
        return null;
    }
}

async function fetchVersions(slug) {
    console.group(`Fetching: ${slug}`);
    try {
        const res = await fetch(`https://api.modrinth.com/v2/project/${slug}/version`);
        if (!res.ok) {
            console.error("HTTP error:", res.status);
            console.groupEnd();
            return null;
        }

        const data = await res.json();
        console.log("Total versions:", data.length);
        console.groupEnd();
        return data;

    } catch (err) {
        console.error("Fetch failed:", err);
        console.groupEnd();
        return null;
    }
}

async function fetchVersionById(versionId) {
    console.group(`Fetching version: ${versionId}`);
    try {
        const res = await fetch(`https://api.modrinth.com/v2/version/${versionId}`);
        if (!res.ok) {
            console.error("HTTP error:", res.status);
            console.groupEnd();
            return null;
        }

        const data = await res.json();
        console.groupEnd();
        return data;

    } catch (err) {
        console.error("Version fetch failed:", err);
        console.groupEnd();
        return null;
    }
}

async function generate() {
    console.clear();
    console.log("=== START ===");

    const includeSnapshots = document.getElementById("snapshots").checked;
    const loader = document.querySelector('input[name="loader"]:checked').value;
    GLOBAL_LOADER = loader;

    const modGroups = parseModGroups(document.getElementById("urls").value);

    let allVersionsSet = new Set();

    let mods = await Promise.all(modGroups.map(async (group) => {
        const slugs = group.map(entry => entry.slug);
        let supported = new Set();
        let versionOptions = {};

        await Promise.all(group.map(async (entry) => {
            const slug = entry.slug;
            const [project, versions] = await Promise.all([
                fetchProject(slug),
                fetchVersions(slug)
            ]);
            if (!versions) return;
            const side = resolveSupportKind(project, entry);

            for (let v of versions) {
                if (!v.loaders.includes(loader)) continue;

                for (let gv of v.game_versions) {

                    if (!includeSnapshots && !isStableRelease(gv)) {
                        console.log(`Filtered non-stable: ${gv} (${slug})`);
                        continue;
                    }

                    supported.add(gv);
                    allVersionsSet.add(gv);
                    if (!versionOptions[gv]) versionOptions[gv] = [];
                    if (!versionOptions[gv].some(option => option.slug === slug)) {
                        versionOptions[gv].push({
                            slug,
                            side,
                            versionId: v.id,
                            fileUrl: getPrimaryFile(v)?.url || null,
                            dependencies: v.dependencies || []
                        });
                    }
                }
            }
        }));

        console.log(`Final versions for ${slugs.join(" OR ")}:`, [...supported]);
        return { names: slugs, versions: supported, versionOptions, enabled: true };
    }));

    GLOBAL_MODS = mods;
    GLOBAL_VERSIONS = Array.from(allVersionsSet).sort((a,b) =>
        b.localeCompare(a, undefined, { numeric: true })
    );

    render();

    console.log("=== DONE ===");
}

function calculateCounts(mods, versions) {
    let counts = {};
    versions.forEach(v => counts[v] = 0);

    mods.forEach(mod => {
        if (!mod.enabled) return;
        mod.versions.forEach(v => {
            if (counts[v] !== undefined) counts[v]++;
        });
    });

    return counts;
}

function getBestVersion(versions, counts) {
    let max = Math.max(...Object.values(counts));

    // get all versions with max count
    let best = versions.filter(v => counts[v] === max);

    console.log("Best candidates:", best);

    // versions are already sorted newest → oldest
    return best[0];
}

function renderModLinks(mod) {
    return mod.names
        .map(name => `<a href="https://modrinth.com/mod/${name}" target="_blank" onclick="event.stopPropagation()">${name}</a>`)
        .join(" OR ");
}

function getSideLabel(side) {
    if (side === "client") return "C";
    if (side === "server") return "S";
    if (side === "both") return "B";
    return "?";
}

function getSideTitle(side) {
    if (side === "client") return "client";
    if (side === "server") return "server";
    if (side === "both") return "client + server";
    return "unknown";
}

function renderSidePill(side) {
    return `<span class="side-pill support-${side}" title="${getSideTitle(side)}">${getSideLabel(side)}</span>`;
}

function escapeHtml(text) {
    return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}

function renderSupportCell(mod, version) {
    const options = mod.versionOptions[version] || [];

    if (options.length === 0) {
        return `<td class="support-cell support-none">-</td>`;
    }

    const parts = options.map(option => `
        <div class="support-part support-${option.side}" title="${escapeHtml(option.slug)}: ${getSideTitle(option.side)}">
            ${getSideLabel(option.side)}
        </div>
    `).join("");

    return `<td class="support-cell"><div class="support-parts">${parts}</div></td>`;
}

function buildTable(mods, versions, counts, bestVersion) {
    let html = "<table><tr><th>Mod</th>";

    for (let v of versions) {
        let max = Math.max(...Object.values(counts));
        let cls = counts[v] === max ? "highlight clickable-header" : "clickable-header";
        html += `
            <th class="${cls}">
                <button class="version-button" onclick="openVersionPicker('${v}')">
                    ${v}
                    <div class="count">${counts[v]}</div>
                </button>
            </th>`;
    }

    html += "</tr>";

    mods.forEach((mod, index) => {
        let disabledClass = mod.enabled ? "" : "disabled";

        html += `<tr class="${disabledClass}" onclick="toggleMod(${index})">`;

        html += `
            <td class="mod-name">
                ${renderModLinks(mod)}
            </td>`;

        for (let v of versions) {
            html += renderSupportCell(mod, v);
        }

        html += "</tr>";
    });

    html += "</table>";
    return html;
}

function render() {
    let counts = calculateCounts(GLOBAL_MODS, GLOBAL_VERSIONS);
    let bestVersion = getBestVersion(GLOBAL_VERSIONS, counts);

    console.log("Counts:", counts);
    console.log("Best version:", bestVersion);

    document.getElementById("output").innerHTML =
        buildTable(GLOBAL_MODS, GLOBAL_VERSIONS, counts, bestVersion);
}

function toggleMod(index) {
    let mod = GLOBAL_MODS[index];
    mod.enabled = !mod.enabled;

    console.log(`Toggled ${mod.names.join(" OR ")}:`, mod.enabled ? "ON" : "OFF");

    render();
}

function getDownloadUrl(slug, version) {
    return `https://modrinth.com/mod/${slug}/versions?version=${encodeURIComponent(version)}&loader=${encodeURIComponent(GLOBAL_LOADER)}#download`;
}

function openVersionPicker(version) {
    ACTIVE_VERSION = version;
    ACTIVE_DOWNLOAD_TARGET = "client";

    const eligibleMods = GLOBAL_MODS.filter(mod =>
        mod.enabled && mod.versions.has(version)
    );

    if (eligibleMods.length === 0) {
        return;
    }

    document.getElementById("modalTitle").textContent = `Open downloads for Minecraft ${version}`;
    document.querySelector('input[name="download-target"][value="client"]').checked = true;
    renderDownloadChoices();
    document.getElementById("versionModal").classList.remove("hidden");
}

function setDownloadTarget(target) {
    ACTIVE_DOWNLOAD_TARGET = target;
    renderDownloadChoices();
}

function renderDownloadChoices() {
    if (!ACTIVE_VERSION) return;

    const eligibleMods = GLOBAL_MODS.filter(mod =>
        mod.enabled && mod.versions.has(ACTIVE_VERSION)
    );

    const target = ACTIVE_DOWNLOAD_TARGET;
    const content = eligibleMods.map((mod, index) => {
        const allOptions = mod.versionOptions[ACTIVE_VERSION] || [];
        const options = allOptions.filter(option => optionMatchesTarget(option, target));
        const safeVersion = escapeHtml(ACTIVE_VERSION);

        if (options.length === 0) {
            return `
                <div class="choice-group">
                    <strong>${renderModLinks(mod)}</strong>
                    <div class="count">No ${escapeHtml(target)} pack match for Minecraft ${safeVersion}. Available: ${allOptions.map(option => `${escapeHtml(option.slug)} ${renderSidePill(option.side)}`).join(" OR ") || "none"}</div>
                </div>`;
        }

        if (options.length === 1) {
            const option = options[0];
            return `
                <div class="choice-group">
                    <strong>${renderModLinks(mod)}</strong>
                    <div class="count">Will open: <a href="${getDownloadUrl(option.slug, ACTIVE_VERSION)}" target="_blank">${escapeHtml(option.slug)}</a>${renderSidePill(option.side)}</div>
                    <input type="hidden" name="mod-choice-${index}" value="${escapeHtml(option.slug)}" data-version-id="${escapeHtml(option.versionId)}">
                </div>`;
        }

        const optionsHtml = options.map((option, optionIndex) => `
            <label>
                <input type="radio" name="mod-choice-${index}" value="${escapeHtml(option.slug)}" data-version-id="${escapeHtml(option.versionId)}" ${optionIndex === 0 ? "checked" : ""}>
                ${escapeHtml(option.slug)} ${renderSidePill(option.side)}
            </label>
        `).join("");

        return `
            <div class="choice-group">
                <strong>${renderModLinks(mod)}</strong>
                <div class="count">Choose the ${escapeHtml(target)} pack mod to open for Minecraft ${safeVersion}</div>
                ${optionsHtml}
            </div>`;
    }).join("");

    document.getElementById("modalContent").innerHTML = content;
}

function hideVersionModal() {
    document.getElementById("versionModal").classList.add("hidden");
    ACTIVE_VERSION = null;
}

function closeVersionModal(event) {
    if (event.target.id === "versionModal") {
        hideVersionModal();
    }
}

function findSelectedOption(input) {
    for (let mod of GLOBAL_MODS) {
        const options = mod.versionOptions[ACTIVE_VERSION] || [];
        const match = options.find(option =>
            option.slug === input.value && option.versionId === input.dataset.versionId
        );
        if (match) return match;
    }

    return null;
}

function openDownloadTarget(url) {
    window.open(url, "_blank");
}

function getDependencyKey(dep) {
    if (dep.version_id) return `version:${dep.version_id}`;
    if (dep.project_id) return `project:${dep.project_id}`;
    if (dep.file_name) return `file:${dep.file_name}`;
    return null;
}

async function getDependencyDownload(dep, dependencyCache) {
    if (dep.dependency_type !== "required") return null;

    const dependencyKey = getDependencyKey(dep);
    if (dependencyKey && dependencyCache.has(dependencyKey)) {
        return dependencyCache.get(dependencyKey);
    }

    let version = null;

    if (dep.version_id) {
        version = await fetchVersionById(dep.version_id);
    } else if (dep.project_id) {
        const versions = await fetchVersions(dep.project_id);
        version = versions?.find(candidate =>
            candidate.loaders.includes(GLOBAL_LOADER) &&
            candidate.game_versions.includes(ACTIVE_VERSION)
        );
    }

    const file = getPrimaryFile(version);
    if (!file) return null;

    const download = {
        name: file.filename || dep.file_name || dep.project_id || dep.version_id,
        url: file.url
    };

    if (dependencyKey) {
        dependencyCache.set(dependencyKey, download);
    }

    return download;
}

async function openSelectedDownloads() {
    if (!ACTIVE_VERSION) return;

    const includeDependencies = document.getElementById("includeDependencies").checked;
    const choiceInputs = document.querySelectorAll('#modalContent input[name^="mod-choice-"]:checked, #modalContent input[type="hidden"][name^="mod-choice-"]');
    const selectedOptions = Array.from(choiceInputs).map(findSelectedOption).filter(Boolean);
    const openedUrls = new Set();
    const dependencyCache = new Map();
    const processedDependencyKeys = new Set();

    for (let option of selectedOptions) {
        const url = includeDependencies && option.fileUrl
            ? option.fileUrl
            : getDownloadUrl(option.slug, ACTIVE_VERSION);

        if (!openedUrls.has(url)) {
            openedUrls.add(url);
            openDownloadTarget(url);
        }
    }

    if (includeDependencies) {
        for (let option of selectedOptions) {
            for (let dep of option.dependencies) {
                const dependencyKey = getDependencyKey(dep);
                if (dependencyKey && processedDependencyKeys.has(dependencyKey)) continue;
                if (dependencyKey) processedDependencyKeys.add(dependencyKey);

                const dependencyDownload = await getDependencyDownload(dep, dependencyCache);
                if (!dependencyDownload || openedUrls.has(dependencyDownload.url)) continue;

                openedUrls.add(dependencyDownload.url);
                openDownloadTarget(dependencyDownload.url);
            }
        }
    }

    hideVersionModal();
}
</script>

</body>
</html>
